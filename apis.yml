name: Tsumobi
description: Tsumobi was a Y Combinator (Winter 2007) mobile messaging startup founded in
  Boston by Joshua Wilson and Adam Bouhenguel, and later backed by Andreessen Horowitz
  (a16z). It built a programming language that sat on top of J2ME so feature-phone
  applications could be downloaded and updated on the fly via URLs, aiming to fix the
  painful install and upgrade cycle of late-2000s mobile apps. The company is inactive
  (YC lists it as Inactive; reporting describes the startup as shut down after raising
  roughly $2M), the tsumobi.com domain no longer serves a website, and no public API,
  developer portal, SDKs, or specifications were found. This profile is retained as a
  historical a16z portfolio record in the API Evangelist network.
